<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DL Portal — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#faf8f4;color:#0a0a0f;font-family:Outfit,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:420px;background:#fff;border:1px solid rgba(10,10,15,.1);border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(10,10,15,.1)}.mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#d4372a,#c8902a);color:#fff;display:flex;align-items:center;justify-content:center;font-family:serif;font-weight:700;margin-bottom:20px}.title{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin-bottom:5px}.sub{color:rgba(10,10,15,.45);font-size:.85rem;margin-bottom:26px}.field{margin-bottom:16px}label{display:block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:rgba(10,10,15,.45);margin-bottom:7px}input{width:100%;padding:12px 13px;border:1px solid rgba(10,10,15,.12);border-radius:10px;font:inherit;outline:none}input:focus{border-color:#d4372a;box-shadow:0 0 0 3px rgba(212,55,42,.1)}button{width:100%;padding:13px;border:0;border-radius:10px;background:#0a0a0f;color:#fff;font:600 .9rem Outfit;cursor:pointer;margin-top:6px}.msg{display:none;margin:14px 0;padding:10px 12px;border-radius:9px;font-size:.78rem}.msg.show{display:block}.error{color:#b02a1e;background:rgba(212,55,42,.07);border:1px solid rgba(212,55,42,.2)}.ok{color:#277a45;background:rgba(39,122,69,.07);border:1px solid rgba(39,122,69,.2)}.back{text-align:center;margin-top:20px;font-size:.8rem;color:rgba(10,10,15,.45)}a{color:#d4372a;text-decoration:none;font-weight:600}.hint{font-size:.72rem;color:rgba(10,10,15,.4);line-height:1.5;margin-top:12px}
</style></head><body><div class="card"><div class="mark">DL</div><div class="title">Create your account</div><div class="sub">Join the DL Student Portal</div>
<form id="form"><div class="field"><label>Full name</label><input id="name" required autocomplete="name" placeholder="Your full name"></div><div class="field"><label>Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters"></div><div class="field"><label>Confirm password</label><input id="confirm" type="password" minlength="6" required autocomplete="new-password" placeholder="Repeat your password"></div><div id="msg" class="msg"></div><button id="btn">Create account</button></form><div class="hint">A verification email may be sent before your first login, depending on your Supabase Auth settings.</div><div class="back">Already have an account? <a href="index.html">Sign in</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
const form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){msg.textContent='Passwords do not match.';msg.className='msg error show';return}btn.disabled=true;btn.textContent='Creating account…';const {data,error}=await dlSupabase.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:window.location.origin+'/DL_Homepage.html'}});if(error){msg.textContent=error.message;msg.className='msg error show';btn.disabled=false;btn.textContent='Create account';return}if(data.session){window.location.href='DL_Homepage.html'}else{msg.textContent='Account created. Check your email to verify your account, then sign in.';msg.className='msg ok show';btn.disabled=false;btn.textContent='Create account'}});
</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DL Portal — Reset Password</title><style>body{margin:0;min-height:100vh;background:#faf8f4;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{max-width:390px;width:100%;background:#fff;border:1px solid #ddd;border-radius:16px;padding:30px;box-shadow:0 12px 40px #0001}h1{margin:0 0 8px}p{color:#666;font-size:14px}label{display:block;font-size:12px;font-weight:bold;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#0a0a0f;color:#fff;font-weight:bold}.msg{margin-top:14px;font-size:14px}.err{color:#b02a1e}.ok{color:#277a45}</style></head><body><div class="card"><h1>Set a new password</h1><p>Choose a new password for your DL Portal account.</p><form id="form"><label>New password</label><input id="password" type="password" minlength="6" required autocomplete="new-password"><label>Confirm password</label><input id="confirm" type="password" minlength="6" required autocomplete="new-password"><button>Update password</button></form><div id="msg" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>const form=document.getElementById('form'),msg=document.getElementById('msg');let recovery=false;dlSupabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')recovery=true});setTimeout(()=>{if(!recovery)msg.textContent='Open this page from the password reset email.'},800);form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){msg.textContent='Passwords do not match.';msg.className='msg err';return}const {error}=await dlSupabase.auth.updateUser({password:p});if(error){msg.textContent=error.message;msg.className='msg err'}else{msg.textContent='Password updated. You can now sign in.';msg.className='msg ok';setTimeout(()=>location.href='index.html',1200)}});</script></body></html>
